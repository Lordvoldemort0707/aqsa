<style>
:root{--ink:#14140f}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#cfd5d0;font-family:"Mukta",sans-serif;color:var(--ink)}
.sheet{margin:14px auto;background:#fff;display:flex;gap:10mm;align-items:center;justify-content:center;padding:10mm;width:max-content;position:relative}
.sheet .cap{position:absolute;top:2.5mm;left:10mm;font:700 8pt "Plus Jakarta Sans";color:#8a948e}
.lbl{position:relative;overflow:hidden;flex:none}

/* ---------- shared pieces ---------- */
.ktag{display:inline-flex;align-items:center;gap:1.6mm}
.ktag img{filter:drop-shadow(0 .5mm .8mm rgba(0,0,0,.45))}
.ktag b{font:400 1em/1 "Anton";letter-spacing:.06em;color:#fff;background:var(--tagbg);padding:.18em .45em .14em;
  transform:skewX(-10deg);border:.35mm solid #fff;border-radius:.6mm;box-shadow:0 .6mm 0 rgba(0,0,0,.25)}
.ribbon{display:inline-block;position:relative;background:var(--rib);color:#fff;font:700 1em/1 "Teko";padding:.1em .55em 0;
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);box-shadow:0 1mm 0 rgba(0,0,0,.2)}
.pill{display:inline-flex;align-items:center;gap:.35em;background:#fff;color:var(--dark);border-radius:999px;font:800 1em/1 "Plus Jakarta Sans";padding:.38em .8em .34em;box-shadow:0 .7mm 0 rgba(0,0,0,.22)}
.pill i{font-style:normal;background:var(--dark);color:var(--acc);border-radius:999px;padding:.16em .5em}
.crops{display:flex;justify-content:center;gap:var(--cg,3mm)}
.crop{display:flex;flex-direction:column;align-items:center;gap:.6mm}
.crop .c{width:var(--cs,14mm);height:var(--cs,14mm);border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 .5mm var(--acc),0 .8mm 1.2mm rgba(0,0,0,.25)}
.crop .c svg{width:78%;height:78%}
.crop span{font:700 var(--cf,9pt)/1 "Mukta";color:var(--cropTxt,#fff);text-shadow:0 .3mm .6mm rgba(0,0,0,.35)}
.bens{display:flex;justify-content:space-between}
.ben{display:flex;flex-direction:column;align-items:center;text-align:center;width:var(--bw,20%)}
.ben .c{width:var(--bs,11mm);height:var(--bs,11mm);border-radius:50%;background:var(--mid);display:grid;place-items:center;border:.5mm solid var(--acc);box-shadow:0 .6mm 1mm rgba(0,0,0,.25)}
.ben .c svg{width:62%;height:62%}
.ben b{font:700 var(--bf,8pt)/1.1 "Mukta";margin-top:.9mm;color:var(--benTxt,var(--dark))}
.netbox{border:.5mm solid currentColor;border-radius:1.6mm;padding:.8mm 2.4mm;display:inline-flex;flex-direction:column;line-height:1}
.netbox small{font:700 .55em "Plus Jakarta Sans";letter-spacing:.06em}
.netbox b{font:400 1.3em/1.1 "Anton";letter-spacing:.03em}
.blank{display:inline-block;min-width:var(--bl,14mm);border-bottom:.25mm solid currentColor;height:.9em;vertical-align:baseline}
.agri{background:#c8102e;color:#fff;border-radius:1.2mm;text-align:center;padding:.8mm 2mm;line-height:1.05}
.agri b{display:block;font:800 1em "Mukta"}
.agri small{font:700 .62em "Plus Jakarta Sans";letter-spacing:.04em}

.tip{display:flex;gap:2mm;align-items:center;background:var(--soft);border:.4mm dashed var(--mid);border-radius:1.6mm;padding:1.6mm 2.4mm;font:600 1em/1.25 "Mukta"}
.tip b{color:var(--mid);font-weight:800}
.tip .ic{flex:none;width:2.2em;height:2.2em;border-radius:50%;background:var(--mid);display:grid;place-items:center}
.tip .ic svg{width:62%;height:62%}
/* info panels */
.info h3{font:700 1.25em/1 "Teko";color:#fff;background:var(--mid);display:inline-block;padding:.18em .5em 0;border-radius:.8mm;margin:0 0 .45em;letter-spacing:.02em}
.info p,.info li{font:500 1em/1.28 "Mukta"}
.info ul{list-style:none}
.info li{padding-left:1.05em;position:relative}
.info li::before{content:"✔";position:absolute;left:0;color:var(--mid);font-weight:800}
.info ul.warn li::before{content:"⚠";color:#c8102e}
table.t{width:100%;border-collapse:collapse;font:600 .95em/1.15 "Mukta"}
table.t th{background:var(--dark);color:#fff;font-weight:700;text-align:left;padding:.35em .5em}
table.t td{padding:.32em .5em;border-bottom:.2mm solid #d6d9d3}
table.t tr:nth-child(even) td{background:var(--soft)}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.25em 1em;font:700 .92em/1.3 "Plus Jakarta Sans"}
.fields .blank{min-width:0;flex:1;margin-left:1mm}
.fields div{display:flex}
.maker{font:500 .86em/1.32 "Plus Jakarta Sans"}
.maker b{font-weight:800}
.qr{background:#fff;padding:1mm;border-radius:1mm;text-align:center;font:700 .7em/1.1 "Mukta";color:#222}
.qr img{display:block;width:100%}
.care{display:flex;align-items:center;gap:1.5mm;background:var(--dark);color:#fff;border-radius:1.2mm;padding:1mm 2mm;font:700 1em/1.1 "Mukta"}
.care b{font:400 1.35em/1 "Anton";letter-spacing:.04em;color:var(--acc)}

/* ---------- POUCH 220 x 320 mm ---------- */
.pouch{width:220mm;height:320mm;background:var(--dark);color:#fff}
.pouch .seal{position:absolute;left:0;right:0;height:12mm;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1.2mm,transparent 1.2mm 2.4mm),var(--dark)}
.pouch .seal.top{top:0}.pouch .seal.bot{bottom:0}
.pouch .tear{position:absolute;top:14mm;left:0;width:4mm;height:4mm;background:#fff;clip-path:polygon(0 0,100% 50%,0 100%)}

/* ---------- BOTTLE WRAP 240 x 110 mm ---------- */
.wrap{width:240mm;height:110mm;display:flex;background:#fff}
.wrap .side{width:70mm;height:100%;padding:4mm 4mm 3.4mm;position:relative;font-size:7.6pt;background:#fff;border-right:.3mm dashed #c9cfc9}
.wrap .side.right{border-right:0;border-left:.3mm dashed #c9cfc9}
.wrap .front{width:100mm;height:100%;position:relative;overflow:hidden;color:#fff}

.cutnote{position:absolute;bottom:-6mm;left:0;right:0;text-align:center;font:700 7pt "Plus Jakarta Sans";color:#9aa39d}
@media print{
  @page{margin:0}
  body{background:#fff}
  .sheet{margin:0 auto;page-break-after:always;break-after:page}
}
</style>
</head>

       <div><h3>मुख्य लाभ</h3><ul>${p.benefits.map(b=>`<li>${b[1]}</li>`).join("")}<li>मिट्टी में पोषक तत्वों की कमी दूर करे</li></ul></div>
       <div><h3>पोषक तत्व (% w/w)</h3><table class="t"><tr><th>तत्व</th><th class="r">%</th></tr>
         ${p.comp.map(r=>`<tr><td>${r[0]}</td><td class="r">${v(r[2],10)}</td></tr>`).join("")}</table></div>
     </div>
     <div><h3>प्रयोग विधि व मात्रा</h3>
       <table class="t"><tr><th>फसल</th><th>कब डालें</th><th class="r">मात्रा (${p.doseUnit})</th></tr>
       ${p.use.map(u=>`<tr><td><b>${CROPS[u[0]]}</b></td><td>${u[1]}</td><td class="r">${v("",22)}</td></tr>`).join("")}</table>
       <p style="margin-top:1.6mm">${p.method}</p></div>
     <div><h3 style="background:#c8102e">सावधानियां</h3><ul class="warn" style="display:grid;grid-template-columns:1fr 1fr;gap:0 4mm">
       <li>बच्चों व पशुओं की पहुंच से दूर रखें</li><li>ठंडी व सूखी जगह पर रखें</li><li>खाने-पीने की चीज़ों से दूर रखें</li><li>प्रयोग के बाद हाथ साबुन से धोएं</li></ul></div>
     <div class="tip"><div class="ic">${icon("leaf")}</div><div><b>किसान भाई ध्यान दें:</b> बेहतर नतीजों के लिए अपने नज़दीकी Krshak दुकानदार से <b>मुफ़्त मिट्टी जांच (POSNA)</b> करवाएं और फसल अनुसार सही सलाह लें।</div></div>
     <div style="display:flex;gap:4mm;align-items:stretch;margin-top:auto">
       <div style="flex:1;display:flex;flex-direction:column;gap:2.4mm">
         <div class="fields" style="border:.5mm solid ${T.dark};border-radius:1.6mm;padding:2.4mm 3.4mm;font-size:10.4pt;line-height:1.55">
           <div>Batch No.<span class="blank"></span></div><div>MRP ₹<span class="blank"></span></div>
           <div>Mfg. Date<span class="blank"></span></div><div>Expiry<span class="blank"></span></div>
           <div>Net Wt.<span class="blank"></span></div><div style="font-weight:600;font-size:.85em">(सभी करों सहित / Incl. of all taxes)</div></div>
         <div class="maker" style="font-size:9.6pt"><b>Manufactured by:</b> ${v(BRAND.manufacturer,110)}<br><b>Mfg. Licence No.:</b> ${v(BRAND.licence,60)}<br>
           <b>Marketed by:</b> ${BRAND.marketedBy}, ${BRAND.address}</div>
       </div>
       <div style="width:38mm;display:flex;flex-direction:column;gap:2mm">
         <div class="qr">${'<img src="assets/qr-krshak.svg" alt="">'}फसल सलाह के लिए स्कैन करें</div>
       </div>
     </div>
     <div class="care" style="font-size:13pt;padding:2mm 4mm;justify-content:space-between"><span>किसान हेल्पलाइन</span><b>${BRAND.phone}</b><span style="font:700 8.6pt 'Plus Jakarta Sans'">${BRAND.email} · ${BRAND.web}</span></div>
   </div>
   <div class="seal bot" style="display:flex;align-items:center;justify-content:center;font:700 8pt 'Plus Jakarta Sans';color:#cfe8d6">MADE IN INDIA · भारत में निर्मित</div>
  </div>`;
}

/* =================================================================
   BOTTLE WRAP (left info | front | right info)
   ================================================================= */
function wrapLabel(p){
  const T=p.theme;
  const nameFill = p.id==="chamak" ? "#ffffff" : "url(#gGold)";
  const nameStroke = p.id==="chamak" ? "#0f5a26" : T.dark;
  const frontBg = p.id==="chamak"
    ? `linear-gradient(180deg,#ffd21a 0%,#ffb000 45%,#f07a00 100%)`
    : `linear-gradient(180deg,${T.dark} 0%,${T.mid} 55%,${T.dark} 100%)`;
  return `<div class="lbl wrap" style="--dark:${T.dark};--mid:${T.mid};--acc:${T.acc};--rib:${T.rib};--soft:${T.soft};--tagbg:${T.tagbg}">
   <!-- LEFT: Hindi info -->
   <div class="side info" style="display:flex;flex-direction:column;gap:2mm">
     <div style="display:flex;align-items:center;justify-content:space-between">
       <div style="font:400 13pt/1 Anton;color:${T.mid};letter-spacing:.04em">${p.en}</div><div style="font:700 13pt/1 Teko;color:${T.dark}">${p.hi}</div></div>
     <p style="font-size:7.5pt;line-height:1.3">${p.about}</p>
     <div><h3>प्रयोग विधि व मात्रा</h3>
       <table class="t" style="font-size:7.3pt"><tr><th>फसल</th><th>कब छिड़कें</th><th class="r">मात्रा*</th></tr>
       ${p.use.map(u=>`<tr><td><b>${CROPS[u[0]]}</b></td><td>${u[1]}</td><td class="r">${v("",10)}</td></tr>`).join("")}</table>
       <p style="font-size:6.8pt;margin-top:1mm;line-height:1.25">*${p.doseUnit}। ${p.method}</p></div>
     <div class="tip" style="font-size:6.6pt;margin-top:auto"><div class="ic">${icon("leaf")}</div><div><b>ध्यान दें:</b> Krshak दुकान पर <b>मुफ़्त मिट्टी जांच</b> करवाएं, सही सलाह पाएं।</div></div>
     <div><h3 style="background:#c8102e">सावधानियां</h3>
       <ul class="warn" style="font-size:7pt;display:grid;grid-template-columns:1fr 1fr;gap:0 2mm"><li>बच्चों की पहुंच से दूर रखें</li><li>ठंडी, सूखी जगह रखें</li><li>खाने की चीज़ों से दूर रखें</li><li>प्रयोग के बाद हाथ धोएं</li></ul></div>
   </div>
   <!-- FRONT -->
   <div class="front" style="background:${frontBg}">
     <svg viewBox="0 0 100 110" style="position:absolute;inset:0;width:100%;height:100%">
       <path d="M0 0H100V44C70 36 30 36 0 46Z" fill="${p.id==='chamak'?'#ffffff':T.mid}" opacity="${p.id==='chamak'?'.25':'.5'}"/>
       <path d="M0 41C30 31 70 31 100 39V42C70 34 30 34 0 44Z" fill="${p.id==='chamak'?'#0f6b2f':T.acc}"/>
     </svg>
     <div style="position:absolute;top:3.2mm;left:4mm;right:4mm;display:flex;justify-content:space-between;align-items:flex-start">
       <div class="ktag" style="font-size:11pt">${logo(9)}<b>KRSHAK</b></div>
       <div style="width:12.5mm;height:14.5mm">${shield("100%","असरदार")}</div>
     </div>
     <div style="position:absolute;top:15mm;left:0;right:0;text-align:center">
       ${bigName(p.en,86,19,nameFill,nameStroke,"rgba(0,0,0,.55)")}
       <div style="margin-top:.6mm"><span class="ribbon" style="font-size:17pt">${p.hi}</span></div>
     </div>
     <div style="position:absolute;top:45.5mm;left:0;right:0;text-align:center">
       <span class="pill" style="font-size:7.6pt"><i>${p.grade}</i>${p.gradeTail}</span>
       <div style="font:700 6.4pt/1.1 'Mukta';margin-top:.9mm;color:${p.id==='chamak'?'#3a1500':'#fff'}">${p.gradeHi}</div>
     </div>
     <div style="position:absolute;top:56mm;left:0;right:0;height:36mm;overflow:hidden">${HERO[p.id](100,35)}
       <div style="position:absolute;top:2.2mm;left:0;right:0;text-align:center;font:700 13pt/1 Teko;color:${p.id==='chamak'?'#5a1d00':'#fff'};text-shadow:${p.id==='chamak'?'0 0 2mm #fff8d6':'0 .4mm 1mm rgba(0,0,0,.6)'}">${p.tag}</div>
     </div>
     <div style="position:absolute;top:91mm;left:0;right:0;height:19mm;background:${p.id==='chamak'?'#0f5a26':T.dark};padding:1.3mm 3mm 0;display:flex;align-items:center;gap:2mm;border-top:.8mm solid ${T.acc}">
       <div class="crops" style="--cs:9.5mm;--cf:6.4pt;--cg:1.6mm;flex:1;justify-content:flex-start">${p.crops.map(c=>`<div class="crop"><div class="c">${cropIcon(c)}</div><span>${CROPS[c]}</span></div>`).join("")}</div>
       <div class="netbox" style="font-size:8pt;color:#fff"><small>NET CONTENT</small><b><span class="blank" style="--bl:14mm"></span></b></div>
     </div>
   </div>
   <!-- RIGHT: composition + statutory -->
   <div class="side right info" style="display:flex;flex-direction:column;gap:1.8mm">
     <div style="display:flex;justify-content:space-between;align-items:center">${'<div class="ktag" style="font-size:8pt">'+logo(6)+'<b>KRSHAK</b></div>'}<div class="agri" style="font-size:6pt"><b>केवल कृषि उपयोग हेतु</b><small>FOR AGRICULTURAL USE ONLY</small></div></div>
     <div><h3>मुख्य लाभ</h3><ul style="font-size:7.3pt;display:grid;grid-template-columns:1fr 1fr;gap:.3mm 2mm">${p.benefits.map(b=>`<li>${b[1]}</li>`).join("")}</ul></div>
     <div><h3>पोषक तत्व · Composition</h3><table class="t" style="font-size:7.2pt"><tr><th>तत्व / Nutrient</th><th class="r">% w/w</th></tr>
        ${p.comp.map(r=>`<tr><td>${r[0]}</td><td class="r">${v(r[2],8)}</td></tr>`).join("")}</table></div>
     <div style="display:flex;gap:2mm;margin-top:auto">
       <div style="flex:1;display:flex;flex-direction:column;gap:1.2mm">
         <div class="fields" style="font-size:6.2pt;line-height:1.5;grid-template-columns:1fr 1fr;border:.35mm solid ${T.dark};border-radius:1mm;padding:1mm 1.4mm">
           <div>Batch<span class="blank"></span></div><div>MRP ₹<span class="blank"></span></div><div>Mfg.<span class="blank"></span></div><div>Exp.<span class="blank"></span></div></div>
         <div class="maker" style="font-size:5.6pt;line-height:1.3"><b>Mfd. by:</b> ${v(BRAND.manufacturer,34)}<br><b>Lic. No.:</b> ${v(BRAND.licence,24)}<br><b>Marketed by:</b> ${BRAND.marketedBy}, ${BRAND.address}</div>
       </div>
       <div class="qr" style="width:16mm;font-size:5.2pt"><img src="assets/qr-krshak.svg" alt="">स्कैन करें</div>
     </div>
     <div class="care" style="font-size:6.4pt;padding:.8mm 1.6mm;justify-content:space-between"><span>हेल्पलाइन</span><b style="font-size:9pt">${BRAND.phone}</b><span style="font:700 5pt 'Plus Jakarta Sans'">${BRAND.web}</span></div>
   </div>
  </div>`;
}

/* ---------- render ---------- */
const out = document.getElementById("out");
out.innerHTML = PACKS.map(p => p.type==="pouch"
  ? `<div class="sheet" id="${p.id}"><div class="cap">${p.en} · ${p.grade} ${p.gradeTail} · Pouch label 220 × 320 mm (front + back)</div>
       <div style="position:relative">${pouchFront(p)}<div class="cutnote">FRONT</div></div>
       <div style="position:relative">${pouchBack(p)}<div class="cutnote">BACK</div></div></div>`
  : `<div class="sheet" id="${p.id}"><div class="cap">${p.en} · ${p.grade} ${p.gradeTail} · Bottle wrap label 240 × 110 mm (left 70 | front 100 | right 70)</div>
       <div style="position:relative">${wrapLabel(p)}<div class="cutnote">LEFT PANEL &nbsp;|&nbsp; FRONT &nbsp;|&nbsp; RIGHT PANEL</div></div></div>`
).join("");
</script>
</body>
</html>
