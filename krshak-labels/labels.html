<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krshak Product Labels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Krshak brand tokens (from krshak.com) ===== */
:root{
  --kr-deep:#0a3a28;      /* header green */
  --kr-deep-2:#064e3b;
  --kr-green:#16a34a;
  --kr-lime:#22c55e;
  --kr-mint:#ecfdf5;
  --kr-gold:#e0a526;      /* logo gold */
  --kr-gold-2:#f6c453;
  --ink:#10231a;
  --muted:#4b5b53;
  --paper:#ffffff;
  --fill:#fff4c2;         /* highlight for values still to be filled */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#d9ded9;font-family:"Mukta","Plus Jakarta Sans",sans-serif;color:var(--ink)}

/* ---- screen toolbar ---- */
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--kr-deep);color:#fff;font:600 14px "Plus Jakarta Sans",sans-serif}
.toolbar img{width:28px;height:28px}
.toolbar .sp{flex:1}
.toolbar label{display:flex;gap:6px;align-items:center;font-weight:500}
.toolbar button{background:var(--kr-lime);color:#05301f;border:0;border-radius:999px;padding:7px 16px;font:700 13px "Plus Jakarta Sans";cursor:pointer}

/* ---- one sheet = front + back of one product ---- */
.sheet{width:297mm;height:210mm;margin:12px auto;background:#fff;display:flex;gap:14mm;
  align-items:center;justify-content:center;position:relative;overflow:hidden}
.sheet .cap{position:absolute;top:6mm;left:10mm;font:600 9pt "Plus Jakarta Sans";color:#7a857f}
.panel{width:100mm;height:150mm;position:relative;overflow:hidden;background:var(--paper);
  border-radius:3mm;outline:0.2mm dashed #b8c2bc;outline-offset:2mm;display:flex;flex-direction:column}
.panel .face-tag{position:absolute;bottom:-7mm;left:0;right:0;text-align:center;font:600 8pt "Plus Jakarta Sans";color:#8b958f}

/* ===== FRONT ===== */
.f-head{flex:none;background:var(--kr-deep);color:#fff;padding:4mm 5mm 3.2mm;display:flex;align-items:center;gap:2.6mm;position:relative}
.f-head img{width:13mm;height:13mm;filter:drop-shadow(0 .6mm .8mm rgba(0,0,0,.35))}
.f-head .wm{font:800 21pt/0.9 "Baloo 2",sans-serif;letter-spacing:.2pt}
.f-head .tl{font:500 7.4pt/1.15 "Mukta";color:#bfe9cf;margin-top:.6mm}
.f-head .fco{margin-left:auto;text-align:right;font:700 6pt/1.25 "Plus Jakarta Sans";color:var(--kr-gold-2);text-transform:uppercase;letter-spacing:.4pt}

.f-hero{position:relative;flex:1;padding:4mm 5mm 0;background:
   radial-gradient(70mm 55mm at 85% 18%, var(--tint-soft) 0, transparent 70%),
   linear-gradient(180deg,#fff 0,#fff 100%)}
.grade{display:inline-flex;align-items:center;gap:1.6mm;background:var(--accent);color:#fff;border-radius:999px;
  padding:1mm 3.2mm 1mm 1.2mm;font:700 8.2pt "Plus Jakarta Sans";letter-spacing:.2pt}
.grade i{font-style:normal;background:#fff;color:var(--accent);border-radius:999px;padding:.2mm 2mm;font-weight:800}
.grade-hi{font:600 8.6pt "Mukta";color:var(--muted);margin-top:1.2mm}

.name-row{display:flex;align-items:center;justify-content:space-between;margin-top:2.4mm}
.pname-hi{font:800 40pt/1.02 "Baloo 2",sans-serif;color:var(--kr-deep)}
.pname-hi b{color:var(--accent);font-weight:800}
.pname-en{font:800 15pt/1 "Plus Jakarta Sans";color:var(--accent);letter-spacing:1.2pt;text-transform:uppercase;margin-top:.4mm}
.crop-badge{width:30mm;height:30mm;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--kr-gold-2),var(--kr-gold) 70%);
  box-shadow:0 0 0 1.2mm #fff,0 0 0 1.6mm var(--kr-gold),0 1.6mm 3mm rgba(0,0,0,.18)}
.crop-badge svg{width:21mm;height:21mm}
.for-crop{margin-top:3.4mm;font:700 10.5pt/1.2 "Mukta";color:var(--ink)}
.for-crop span{display:block;font:600 7.6pt "Plus Jakarta Sans";color:var(--muted);margin-top:.4mm}

.benefits{list-style:none;margin-top:3.2mm;display:grid;gap:1.6mm}
.benefits li{display:flex;gap:2mm;align-items:flex-start;background:var(--tint-soft);border-left:1.2mm solid var(--accent);
  border-radius:1.4mm;padding:1.4mm 2mm}
.benefits .ic{flex:none;width:5mm;height:5mm;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 7pt "Plus Jakarta Sans";margin-top:.3mm}
.benefits .t{font:700 8.8pt/1.15 "Mukta"}
.benefits .e{display:block;font:500 6.6pt/1.2 "Plus Jakarta Sans";color:var(--muted)}

.f-foot{margin-top:auto;padding:2.6mm 5mm 3mm;display:flex;gap:3mm;align-items:stretch}
.qty{flex:1;border:0.45mm solid var(--kr-deep);border-radius:2mm;padding:1.4mm 2.4mm;display:flex;flex-direction:column;justify-content:center}
.qty .l{font:700 6.6pt "Plus Jakarta Sans";color:var(--muted);text-transform:uppercase;letter-spacing:.4pt}
.qty .v{font:800 13pt/1.05 "Plus Jakarta Sans";color:var(--kr-deep)}
.agri{flex:none;width:31mm;background:var(--kr-deep);color:#fff;border-radius:2mm;padding:1.4mm 2.2mm;display:flex;flex-direction:column;justify-content:center;text-align:center}
.agri b{font:700 8pt/1.1 "Mukta"}
.agri small{font:600 5.8pt "Plus Jakarta Sans";color:#bfe9cf}
.f-strip{flex:none;height:7mm;background:linear-gradient(90deg,var(--kr-deep) 0,var(--accent) 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5mm;font:700 7.4pt "Plus Jakarta Sans";letter-spacing:.3pt}
.f-strip .dot{width:1.2mm;height:1.2mm;border-radius:50%;background:var(--kr-gold-2);display:inline-block;margin:0 1.6mm;vertical-align:middle}

/* ===== BACK ===== */
.b-head{flex:none;background:var(--kr-deep);color:#fff;padding:2.6mm 4.4mm;display:flex;align-items:center;gap:2.2mm}
.b-head img{width:8.5mm;height:8.5mm}
.b-head .wm{font:800 13pt/1 "Baloo 2"}
.b-head .pn{margin-left:auto;text-align:right;font:800 12pt/1 "Baloo 2";color:var(--kr-gold-2)}
.b-head .pn small{display:block;font:700 6.4pt "Plus Jakarta Sans";color:#bfe9cf;letter-spacing:.6pt;margin-top:.6mm}
.b-body{padding:2.4mm 4.4mm 1.6mm;display:flex;flex-direction:column;gap:1.7mm;flex:1;min-height:0}
.sec h4{font:800 8.4pt/1 "Mukta";color:var(--accent);display:flex;align-items:center;gap:1.4mm;margin-bottom:1mm}
.sec h4 small{font:700 6.4pt "Plus Jakarta Sans";color:var(--muted);text-transform:uppercase;letter-spacing:.4pt}
.sec h4::before{content:"";width:1.2mm;height:3.2mm;background:var(--accent);border-radius:.6mm}
table.comp{width:100%;border-collapse:collapse;font:600 7.4pt "Plus Jakarta Sans"}
table.comp th{background:var(--accent);color:#fff;text-align:left;padding:.9mm 1.8mm;font-weight:700;font-size:6.6pt;letter-spacing:.3pt}
table.comp th:last-child,table.comp td:last-child{text-align:right}
table.comp td{padding:.55mm 1.8mm;border-bottom:.2mm solid #dbe5df}
table.comp td .hi{font:500 6.6pt "Mukta";color:var(--muted);margin-left:1mm}
table.comp tr:nth-child(even) td{background:var(--tint-soft)}
.blank{display:inline-block;min-width:11mm;border-bottom:.25mm solid #7d8a83;text-align:center}
.show-fill .blank{background:var(--fill);border-bottom-color:#d39b00}
.dir{font:500 7.3pt/1.32 "Mukta"}
.dir .row{display:flex;gap:1.4mm}
.dir .row b{font-weight:700;min-width:15mm;color:var(--ink)}
.dir .en{font:500 6.1pt/1.25 "Plus Jakarta Sans";color:var(--muted)}
ul.caut{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.6mm 2.4mm;font:500 6.7pt/1.2 "Mukta"}
ul.caut li{padding-left:2.6mm;position:relative}
ul.caut li::before{content:"";position:absolute;left:0;top:1.3mm;width:1.2mm;height:1.2mm;border-radius:50%;background:#c2410c}
ul.caut li span{display:block;font:500 5.6pt/1.15 "Plus Jakarta Sans";color:var(--muted)}
.batch{display:grid;grid-template-columns:1fr 1fr;border:.35mm solid var(--kr-deep);border-radius:1.6mm;overflow:hidden;font:700 6.6pt "Plus Jakarta Sans"}
.batch div{padding:1.1mm 1.8mm;border-bottom:.2mm solid #c9d6ce;display:flex;justify-content:space-between;gap:1mm}
.batch div:nth-child(odd){border-right:.2mm solid #c9d6ce}
.batch div:nth-last-child(-n+2){border-bottom:0}
.batch .blank{min-width:14mm}
.maker{display:flex;gap:2.4mm;align-items:flex-start}
.maker .txt{flex:1;font:500 6.2pt/1.3 "Plus Jakarta Sans";color:var(--ink)}
.maker .txt b{font-weight:800}
.maker .qr{flex:none;width:17mm;text-align:center;font:700 5.2pt/1.15 "Mukta";color:var(--muted)}
.maker .qr img{width:17mm;height:17mm;display:block;margin-bottom:.4mm}
.b-strip{flex:none;margin-top:auto;height:6mm;background:var(--kr-deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4.4mm;font:700 6.6pt "Plus Jakarta Sans"}
.b-strip span:last-child{color:var(--kr-gold-2)}

@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .toolbar{display:none}
  .sheet{margin:0;page-break-after:always;break-after:page}
  .panel{outline-color:#c9d1cc}
}
@media screen and (max-width:1000px){
  .sheet{transform-origin:top left}
}
</style>
</head>

    <path d="M26 58l-2 3M32 58v4M38 58l2 3" fill="none"/></g></svg>`,
  garlic:`<svg viewBox="0 0 64 64"><g stroke="#5a3a06" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 18V4" stroke="#15803d" stroke-width="2.2" fill="none"/>
    <path d="M32 16c-4 4-20 10-20 26 0 10 9 16 20 16s20-6 20-16c0-16-16-22-20-26z" fill="#fffaf0"/>
    <path d="M32 20c-6 6-10 14-10 24 0 6 4 12 10 14M32 20c6 6 10 14 10 24 0 6-4 12-10 14M32 22v36" fill="none" stroke-width="1.1"/>
    <path d="M26 58l-2 3M32 58v4M38 58l2 3" fill="none"/></g></svg>`,
};

/* ===================================================================== */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = (v, w) => v ? esc(v) : `<span class="blank"${w?` style="min-width:${w}mm"`:""}>&nbsp;</span>`;

function front(p, F){
  const ben = p.benefits || F.benefits;
  return `<section class="panel front">
    <div class="f-head">
      <img src="assets/krshak-logo.png" alt="Krshak">
      <div><div class="wm">Krshak</div><div class="tl">किसान और दुकानदार, दोनों का साथी</div></div>
      <div class="fco">फसल पोषण<br>Crop Nutrition</div>
    </div>
    <div class="f-hero">
      <div class="grade"><i>${esc(F.grade)}</i>${esc(F.gradeTail)}</div>
      <div class="grade-hi">${esc(F.gradeHi)}</div>
      <div class="name-row">
        <div>
          <div class="pname-hi">${esc(p.hi)} <b>${p.n}</b></div>
          <div class="pname-en">${esc(p.en)} ${p.n}</div>
        </div>
        <div class="crop-badge">${ICONS[p.crop]}</div>
      </div>
      <div class="for-crop">${esc(p.cropHi)} की फसल के लिए विशेष पोषण
        <span>Special crop nutrition for ${esc(p.cropEn)}</span></div>
      <ul class="benefits">
        ${ben.map((b,i)=>`<li><span class="ic">${i+1}</span><span><span class="t">${esc(b[0])}</span><span class="e">${esc(b[1])}</span></span></li>`).join("")}
      </ul>
    </div>
    <div class="f-foot">
      <div class="qty"><span class="l">शुद्ध मात्रा · Net Content</span><span class="v">${val(BRAND.netContent,22)}</span></div>
      <div class="agri"><b>केवल कृषि उपयोग हेतु</b><small>FOR AGRICULTURAL USE ONLY</small></div>
    </div>
    <div class="f-strip"><span>QUALITY<span class="dot"></span>TRUST<span class="dot"></span>GROWTH</span><span>${esc(BRAND.web)}</span></div>
    <div class="face-tag">FRONT</div>
  </section>`;
}

function back(p, F){
  return `<section class="panel back">
    <div class="b-head">
      <img src="assets/krshak-logo.png" alt="">
      <div class="wm">Krshak</div>
      <div class="pn">${esc(p.hi)} ${p.n}<small>${esc(p.en.toUpperCase())} ${p.n} · ${esc(F.grade)} ${esc(F.gradeTail)}</small></div>
    </div>
    <div class="b-body">
      <div class="sec">
        <h4>संरचना <small>Guaranteed Composition</small></h4>
        <table class="comp">
          <tr><th>Nutrient · पोषक तत्व</th><th>% w/w (min.)</th></tr>
          ${F.comp.map(r=>`<tr><td>${esc(r[0])}<span class="hi">${esc(r[1])}</span></td><td>${val(r[2])}</td></tr>`).join("")}
        </table>
      </div>
      <div class="sec dir">
        <h4>प्रयोग विधि <small>Directions for use</small></h4>
        <div class="row"><b>फसल</b><span>${esc(p.cropHi)} <span class="en">· Crop: ${esc(p.cropEn)}</span></span></div>
        <div class="row"><b>मात्रा</b><span>${val("",22)} प्रति एकड़ <span class="en">· Dose per acre</span></span></div>
        <div class="row"><b>समय</b><span>${val("",44)} <span class="en">· Time of application</span></span></div>
        <div class="row"><b>विधि</b><span>${val("",44)} <span class="en">· Method</span></span></div>
        <div class="en" style="margin-top:.6mm">अपने नज़दीकी Krshak दुकानदार से फसल अनुसार सलाह लें · Ask your Krshak retailer for crop-stage advice.</div>
      </div>
      <div class="sec">
        <h4>सावधानियां <small>Precautions</small></h4>
        <ul class="caut">
          <li>बच्चों की पहुंच से दूर रखें<span>Keep out of reach of children</span></li>
          <li>ठंडी व सूखी जगह पर रखें<span>Store in a cool, dry place</span></li>
          <li>खाद्य पदार्थ व चारे से दूर रखें<span>Keep away from food & feed</span></li>
          <li>प्रयोग के बाद हाथ अच्छी तरह धोएं<span>Wash hands after use</span></li>
        </ul>
      </div>
      <div class="batch">
        <div>Batch No. ${val("",16)}</div><div>MRP ₹ ${val("",16)}</div>
        <div>Mfg. Date ${val("",16)}</div><div>Expiry ${val("",18)}</div>
        <div>Net Content ${val(BRAND.netContent,14)}</div><div style="font-weight:600;font-size:5.6pt;justify-content:flex-start">(Incl. of all taxes)</div>
      </div>
      <div class="maker">
        <div class="txt">
          <b>Manufactured by:</b> ${val(BRAND.manufacturer,52)}<br>
          <b>Mfg. Licence No.:</b> ${val(BRAND.mfgLicence,34)}<br>
          <b>Marketed by:</b> ${esc(BRAND.marketedBy)}, ${esc(BRAND.address)}<br>
          <b>Customer care:</b> ${esc(BRAND.phone)} · ${esc(BRAND.email)}
        </div>
        <div class="qr"><img src="assets/qr-krshak.svg" alt="QR krshak.com">फसल सलाह के लिए स्कैन करें</div>
      </div>
    </div>
    <div class="b-strip"><span>Made in India</span><span>${esc(BRAND.web)}</span></div>
    <div class="face-tag">BACK</div>
  </section>`;
}

const root = document.getElementById("sheets");
root.innerHTML = PRODUCTS.map((p,i)=>{
  const F = FORMULAS[p.f];
  return `<div class="sheet" id="${p.en.toLowerCase()}-${p.n}" style="--accent:${F.accent};--tint-soft:${F.soft}">
    <div class="cap">${i+1}/12 · Krshak ${esc(p.en)} ${p.n} · ${esc(F.grade)} ${esc(F.gradeTail)} · 100 × 150 mm each face</div>
    ${front(p,F)}${back(p,F)}
  </div>`;
}).join("");

document.getElementById("fillToggle").addEventListener("change", e =>
  document.body.classList.toggle("show-fill", e.target.checked));
if (new URLSearchParams(location.search).has("print")) document.body.classList.remove("show-fill");
</script>
</body>
</html>
